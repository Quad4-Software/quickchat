name: quickchat

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  quickchat:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${QUICKCHAT_VERSION:-dev}
        REVISION: ${QUICKCHAT_REVISION:-unknown}
    image: quickchat:latest
    restart: unless-stopped
    user: "65532:65532"
    environment:
      - QUICKCHAT_ADDR=:8080
      - QUICKCHAT_DATA=/data
      - QUICKCHAT_ROOM_TTL=${QUICKCHAT_ROOM_TTL:-168h}
      - QUICKCHAT_ATTACHMENT_TTL=${QUICKCHAT_ATTACHMENT_TTL:-24h}
      - QUICKCHAT_MAX_UPLOAD=${QUICKCHAT_MAX_UPLOAD:-67108864}
      - QUICKCHAT_PPROF=${QUICKCHAT_PPROF:-}
      - QUICKCHAT_TRUSTED_PROXY=true
      - LIVEKIT_URL=${LIVEKIT_URL:?}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:?}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:?}
      - TZ=${TZ:-UTC}
    volumes:
      - quickchat-data:/data
    tmpfs:
      - /tmp:size=64m,mode=1777
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    expose:
      - "8080"
    networks:
      - web
    labels:
      - traefik.enable=true
      - traefik.docker.network=quickchat-web
      - traefik.http.routers.quickchat.rule=Host(`${QUICKCHAT_DOMAIN:?}`)
      - traefik.http.routers.quickchat.entrypoints=websecure
      - traefik.http.routers.quickchat.tls.certresolver=le
      - traefik.http.services.quickchat.loadbalancer.server.port=8080
    healthcheck:
      test: ["CMD", "/quickchat", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
    logging: *default-logging

  traefik:
    image: docker.io/library/traefik:v3.5@sha256:16acb89c6db341182970d6fdafece31303b0a380a8ed7aa51682e225229bf1d2
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=quickchat-web
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.le.acme.tlschallenge=true
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL:?}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      # traefik only needs read access to the docker API. For a stricter
      # setup, front the socket with wollomatic/socket-proxy and point
      # providers.docker.endpoint at it instead.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-certs:/letsencrypt
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=32m,mode=1777
    networks:
      - web
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    logging: *default-logging

networks:
  web:
    driver: bridge

volumes:
  quickchat-data:
  traefik-certs:
