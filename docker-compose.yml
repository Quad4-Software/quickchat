name: quickchat

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  quickchat:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${QUICKCHAT_VERSION:-dev}
        REVISION: ${QUICKCHAT_REVISION:-unknown}
    image: quickchat:latest
    restart: unless-stopped
    user: "65532:65532"
    environment:
      - QUICKCHAT_ADDR=:8080
      - QUICKCHAT_DATA=/data
      - QUICKCHAT_ROOM_TTL=${QUICKCHAT_ROOM_TTL:-168h}
      - QUICKCHAT_MAX_FILE=${QUICKCHAT_MAX_FILE:-67108864}
      - QUICKCHAT_ICE_SERVERS=${QUICKCHAT_ICE_SERVERS:-}
      - QUICKCHAT_PPROF=${QUICKCHAT_PPROF:-}
      - QUICKCHAT_TRUSTED_PROXY=true
      - LIVEKIT_URL=wss://lk.${QUICKCHAT_DOMAIN:?}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:?}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:?}
      - TZ=${TZ:-UTC}
    volumes:
      - quickchat-data:/data
    tmpfs:
      - /tmp:size=64m,mode=1777
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    expose:
      - "8080"
    networks:
      - web
    labels:
      - traefik.enable=true
      - traefik.docker.network=quickchat-web
      - traefik.http.routers.quickchat.rule=Host(`${QUICKCHAT_DOMAIN:?}`)
      - traefik.http.routers.quickchat.entrypoints=websecure
      - traefik.http.routers.quickchat.tls.certresolver=le
      - traefik.http.services.quickchat.loadbalancer.server.port=8080
    healthcheck:
      test: ["CMD", "/quickchat", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
    logging: *default-logging

  # bundled livekit server so the stack is all in one. signaling is
  # proxied at lk.<domain> by traefik; media rides dedicated ports.
  # on a vps, open 7881/tcp and 7882/udp in the firewall.
  livekit:
    image: livekit/livekit-server:v1.13.7@sha256:6fd3b7088874c4d119160dd688798dfec852bc014786d392caad15f6f63912a3
    restart: unless-stopped
    user: "65532:65532"
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:?}: ${LIVEKIT_API_SECRET:?}"
      # advertise the public ip via stun by default. To pin it, set
      # LIVEKIT_USE_EXTERNAL_IP=false and LIVEKIT_NODE_IP=<ip>.
      NODE_IP: "${LIVEKIT_NODE_IP:-}"
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: 7881
          udp_port: 7882
          use_external_ip: ${LIVEKIT_USE_EXTERNAL_IP:-true}
      TZ: ${TZ:-UTC}
      HOME: /tmp
    ports:
      - "7881:7881"
      - "7882:7882/udp"
    tmpfs:
      - /tmp:size=64m,mode=1777
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    expose:
      - "7880"
    networks:
      - web
    labels:
      - traefik.enable=true
      - traefik.docker.network=quickchat-web
      - traefik.http.routers.livekit.rule=Host(`lk.${QUICKCHAT_DOMAIN:?}`)
      - traefik.http.routers.livekit.entrypoints=websecure
      - traefik.http.routers.livekit.tls.certresolver=le
      - traefik.http.services.livekit.loadbalancer.server.port=7880
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 512M
    logging: *default-logging

  traefik:
    image: docker.io/library/traefik:v3.5@sha256:16acb89c6db341182970d6fdafece31303b0a380a8ed7aa51682e225229bf1d2
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=quickchat-web
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.le.acme.tlschallenge=true
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL:?}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      # traefik only needs read access to the docker API. For a stricter
      # setup, front the socket with wollomatic/socket-proxy and point
      # providers.docker.endpoint at it instead.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-certs:/letsencrypt
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=32m,mode=1777
    networks:
      - web
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    logging: *default-logging

networks:
  web:
    driver: bridge

volumes:
  quickchat-data:
  traefik-certs:
