# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: quickchat-desktop

# desktop needs per-os runners because linux and darwin link system
# libraries through cgo. The release workflow runs this file once per
# DESKTOP_TARGET on matching runners and merges every partial dist and
# checksums.txt before signing.
before:
  hooks:
    - pnpm -C web install --frozen-lockfile
    - pnpm -C web build

builds:
  - id: desktop-linux-amd64
    main: ./cmd/desktop
    binary: quickchat
    env:
      - CGO_ENABLED=1
    goos:
      - linux
    goarch:
      - amd64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/Quad4-Software/quickchat/internal/version.Version={{ .Version }}
      - -X github.com/Quad4-Software/quickchat/internal/version.Commit={{ .Commit }}
    skip: '{{ if ne .Env.DESKTOP_TARGET "linux-amd64" }}true{{ end }}'

  - id: desktop-windows
    main: ./cmd/desktop
    binary: quickchat
    env:
      - CGO_ENABLED=0
    goos:
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/Quad4-Software/quickchat/internal/version.Version={{ .Version }}
      - -X github.com/Quad4-Software/quickchat/internal/version.Commit={{ .Commit }}
    skip: '{{ if ne .Env.DESKTOP_TARGET "windows" }}true{{ end }}'

  - id: desktop-darwin
    main: ./cmd/desktop
    binary: quickchat
    env:
      - CGO_ENABLED=1
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/Quad4-Software/quickchat/internal/version.Version={{ .Version }}
      - -X github.com/Quad4-Software/quickchat/internal/version.Commit={{ .Commit }}
    # clang on apple silicon needs the target arch spelled out or the
    # objc side compiles for the host arch and the link fails
    compilers:
      - goos: darwin
        goarch: amd64
        cc: clang -arch x86_64
        cxx: clang++ -arch x86_64
      - goos: darwin
        goarch: arm64
        cc: clang -arch arm64
        cxx: clang++ -arch arm64
    skip: '{{ if ne .Env.DESKTOP_TARGET "darwin" }}true{{ end }}'

archives:
  - name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

# the workflow creates the github release so provenance, signatures and
# attestations can be attached in one place
release:
  disable: true

changelog:
  disable: true
