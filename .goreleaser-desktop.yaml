# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: quickchat-desktop

# desktop needs per-os runners because linux and darwin link system
# libraries through cgo. The release workflow runs this file once per
# DESKTOP_TARGET on matching runners and merges every partial dist and
# checksums.txt before signing.
before:
  hooks:
    - pnpm -C web install --frozen-lockfile
    - pnpm -C web build

builds:
  - id: desktop-linux-amd64
    main: ./cmd/desktop
    binary: quickchat
    env:
      - CGO_ENABLED=1
    goos:
      - linux
    goarch:
      - amd64
    tags:
      - production
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/Quad4-Software/quickchat/internal/version.Version={{ .Version }}
      - -X github.com/Quad4-Software/quickchat/internal/version.Commit={{ .Commit }}
    skip: '{{ if ne .Env.DESKTOP_TARGET "linux-amd64" }}true{{ end }}'

  - id: desktop-windows
    main: ./cmd/desktop
    binary: quickchat
    env:
      - CGO_ENABLED=0
    goos:
      - windows
    goarch:
      - amd64
      - arm64
    tags:
      - production
    flags:
      - -trimpath
    ldflags:
      - -s -w -H windowsgui
      - -X github.com/Quad4-Software/quickchat/internal/version.Version={{ .Version }}
      - -X github.com/Quad4-Software/quickchat/internal/version.Commit={{ .Commit }}
    skip: '{{ if ne .Env.DESKTOP_TARGET "windows" }}true{{ end }}'

  - id: desktop-darwin-amd64
    main: ./cmd/desktop
    binary: quickchat
    env:
      - CGO_ENABLED=1
      # clang on apple silicon defaults to the host arch so the amd64
      # cross build must spell out -arch for the objc side
      - CC=clang -arch x86_64
      - CXX=clang++ -arch x86_64
    goos:
      - darwin
    goarch:
      - amd64
    tags:
      - production
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/Quad4-Software/quickchat/internal/version.Version={{ .Version }}
      - -X github.com/Quad4-Software/quickchat/internal/version.Commit={{ .Commit }}
    skip: '{{ if ne .Env.DESKTOP_TARGET "darwin" }}true{{ end }}'

  - id: desktop-darwin-arm64
    main: ./cmd/desktop
    binary: quickchat
    env:
      - CGO_ENABLED=1
    goos:
      - darwin
    goarch:
      - arm64
    tags:
      - production
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/Quad4-Software/quickchat/internal/version.Version={{ .Version }}
      - -X github.com/Quad4-Software/quickchat/internal/version.Commit={{ .Commit }}
    skip: '{{ if ne .Env.DESKTOP_TARGET "darwin" }}true{{ end }}'

archives:
  - id: linux
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    ids:
      - desktop-linux-amd64
    formats:
      - tar.gz
    files:
      - LICENSE
      - README.md
      - src: cmd/desktop/linux/quickchat.desktop
      - src: cmd/desktop/icon.png
        dst: quickchat.png
  - id: desktop
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    ids:
      - desktop-windows
      - desktop-darwin-amd64
      - desktop-darwin-arm64
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

# the workflow creates the github release so provenance, signatures and
# attestations can be attached in one place
release:
  disable: true

changelog:
  disable: true
