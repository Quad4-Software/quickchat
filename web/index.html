<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0a0a0b" />
    <meta
      name="description"
      content="quickchat: ephemeral rooms with peer to peer chat and live voice and video"
    />
    <title>quickchat</title>
    <link rel="icon" type="image/svg+xml" href="/quad4-mark.svg" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
  </head>
  <body>
    <!-- static landing skeleton, painted before the js bundle loads;
         react replaces #root on mount -->
    <div id="root">
      <div class="relative flex h-full items-center justify-center px-4">
        <div class="relative w-full max-w-sm">
          <div class="flex flex-col items-center gap-3 pb-8">
            <span
              role="img"
              aria-label="Quad4"
              style="
                display: inline-block;
                width: 48px;
                height: 48px;
                background-color: #e9e9ec;
                -webkit-mask-image: url(/quad4-mark.svg);
                mask-image: url(/quad4-mark.svg);
                -webkit-mask-size: contain;
                mask-size: contain;
                -webkit-mask-repeat: no-repeat;
                mask-repeat: no-repeat;
                -webkit-mask-position: center;
                mask-position: center;
              "
            ></span>
            <h1 class="text-xl font-semibold tracking-tight text-emphasis">quickchat</h1>
            <p class="text-sm text-muted-foreground">
              ephemeral rooms with live voice and video
            </p>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
