packages:
  - .

# Reject dependency versions published less than 7 days ago.
minimumReleaseAge: 10080
minimumReleaseAgeStrict: true

# Fail install when a dependency wants to run a build script that is not allowlisted.
strictDepBuilds: true
allowBuilds:
  esbuild: true
  # vue-demi postinstall only selects the vue 2 or 3 shim for scalar
  vue-demi: true
  # protobufjs postinstall only checks the version scheme, never needed
  protobufjs: false

# Block unexpected injected transitive dependencies.
blockExoticSubdeps: true

# Reinstall when node_modules is stale instead of running against it.
verifyDepsBeforeRun: install

savePrefix: ''

# Pin vulnerable transitive deps to patched releases.
overrides:
  tmp: 0.2.7
  uuid: 11.1.1
  basic-ftp: 6.2.1
  ip-address: 10.7.4
  zod: 4.6.6
  source-map-js: 1.2.2
  undici: 7.30.1
